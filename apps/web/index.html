<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tres Amigos</title>
    <link rel="icon" href="/assets/site/tres-amigos-logo-new.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/site/tres-amigos-logo-new.png" />
    <link rel="preload" as="image" href="/assets/site/tres-amigos-logo-new.png" />
    <style>
      html, body { margin: 0; background: #fffdf8; }
      html:not(.site-ready) { overflow: hidden; }
      #site-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #fffdf8;
        transition: opacity .38s ease, visibility .38s ease;
      }
      #site-boot img {
        width: 168px;
        height: auto;
        display: block;
      }
      #site-boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="site-boot" aria-busy="true" aria-live="polite">
      <img src="/assets/site/tres-amigos-logo-new.png" alt="Tres Amigos" width="168" height="61" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
